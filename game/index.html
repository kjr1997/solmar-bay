<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0c1016;
    overflow: hidden; font-family: sans-serif;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #fallback {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #ddd; font-size: 15px; text-align: center; display: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<noscript><p style="color:#fff;text-align:center">Solmar Bay needs JavaScript enabled to play.</p></noscript>
<div id="fallback">Solmar Bay needs JavaScript enabled to play.</div>
<script type="module" src="./src/main.js"></script>
<script>
  // If the module fails to load, show a plain message instead of a black screen.
  window.addEventListener('error', function (e) {
    if (!window.__solmarStarted) document.getElementById('fallback').style.display = 'block';
  });
</script>
</body>
</html>
